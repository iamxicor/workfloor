<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workfloor · Locked</title>
<style>
:root{--bg:#12161c;--ink:#ece6da;--muted:#a9b0ba;--mint:#74e0b5}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#ece5d8;--ink:#1f1c18;--muted:#5a544a;--mint:#1f9d6c}}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;padding:16px;box-sizing:border-box}
main{max-width:360px;text-align:center}h1{font-size:22px;margin:12px 0 6px}p{color:var(--muted);line-height:1.5;margin:0}
.badge{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mint);letter-spacing:.08em}
</style></head>
<body><main><div class="badge">WORKFLOOR · FRONT DESK</div><h1>Badge required</h1>
<p>On your Mac, open Workfloor and tap <b>Phone</b>. Scan the QR code with this device to sign it in.</p></main></body></html>
